<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
    <link type="text/css" rel="stylesheet" href="./assets/css/wall.css">
    <title>Multiviewer</title>
</head>
<body>
    <header id="wallbar">
        <a id="backToGrid" href="./grid.html" title="Back to all streams">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            All streams
        </a>
        <h1>Multiviewer</h1>
        <span id="wallStatus" class="wall-pill">Connecting to the signalling server…</span>
        <div class="wall-spacer"></div>
        <span id="tileCount" class="wall-fact" hidden></span>
        <button id="feedToggle" type="button" aria-expanded="false" aria-controls="feedPanel" title="Choose which streams are on the wall">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
            <span class="feed-toggle-label">Feeds</span>
        </button>
        <div class="layout" role="group" aria-label="Layout">
            <button type="button" data-layout="auto" class="is-active">Auto</button>
            <button type="button" data-layout="1" title="One feed, full size">1</button>
            <button type="button" data-layout="4" title="Two by two">2&times;2</button>
            <button type="button" data-layout="9" title="Three by three">3&times;3</button>
            <button type="button" data-layout="16" title="Four by four">4&times;4</button>
        </div>
        <button id="wallFullscreen" type="button" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
            <span id="fullscreenLabel">Fullscreen</span>
        </button>
        <span id="clock" class="wall-clock">--:--:--</span>
    </header>

    <main id="wall"></main>

    <div id="empty" hidden>
        <p class="empty-title">No streams yet</p>
        <p class="empty-body">Waiting for a streamer to connect to the signalling server. This page fills itself in as soon as one appears.</p>
    </div>

    <!-- The stream picker. A drawer rather than a mode, because the wall has to stay
         watchable while the choice is being made: opening it covers the left column of
         tiles and nothing else. -->
    <aside id="feedPanel" class="feed-panel" aria-label="Choose which streams are on the wall" aria-hidden="true">
        <div class="feed-head">
            <h2>Streams on the wall</h2>
            <button id="feedClose" type="button" title="Close (Esc)" aria-label="Close the stream picker">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
        </div>
        <div class="feed-picks">
            <button id="feedAll" type="button" title="Show every stream, including ones that connect later">All</button>
            <button id="feedLive" type="button" title="Keep only the streams that are sending media right now">Live only</button>
            <button id="feedNone" type="button" title="Take every stream off the wall">None</button>
        </div>
        <ul id="feedList" class="feed-list"></ul>
        <p id="feedNote" class="feed-note"></p>
    </aside>
</body>
</html>
